<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自己紹介 - aaaaaaaa</title>
  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #4a90e2;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 30px auto;
      background: #fff;
      padding: 20px 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
    }

    h1, h2 {
      margin-top: 0;
    }

    .profile {
      display: flex;
      gap: 20px;
      align-items: center;
      margin-bottom: 20px;
    }

    .profile img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .profile-text p {
      margin: 4px 0;
    }

    ul {
      padding-left: 20px;
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      color: #777;
      padding: 15px 0 25px;
    }

    /* --- 競馬ゲーム用スタイル --- */
    .race-track {
      margin-top: 40px;
      padding: 20px;
      background: #eef6ff;
      border-radius: 10px;
    }

    /* UI（説明・選択・ボタン・結果） */
    .race-ui {
      margin-bottom: 20px;
    }

    /* 馬が走るエリア（UIと完全に分離） */
    .race-field {
      position: relative;
      background: #dff0ff;
      height: 260px; /* ← 馬専用の広いスペース */
      border-radius: 10px;
      overflow: hidden;
      margin-top: 20px;
    }

    /* ゴール線 */
    .goal-line {
      position: absolute;
      left: 650px; /* ← 奥に配置 */
      top: 0;
      width: 4px;
      height: 100%;
      background: red;
    }

    /* 馬 */
    .horse {
      width: 60px;
      height: 40px;
      background: #ffcc66;
      border-radius: 8px;
      text-align: center;
      line-height: 40px;
      position: absolute;
      left: 0;
      font-weight: bold;
    }

    /* 馬の位置（UIと絶対に重ならない） */
    #horse1 { top: 40px; }
    #horse2 { top: 120px; }
    #horse3 { top: 200px; }

    #startBtn {
      padding: 10px 20px;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    #startBtn:hover {
      background: #357ac8;
    }

    #result {
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    #record {
      margin-top: 10px;
      font-size: 1rem;
      color: #444;
    }
  </style>
</head>
<body>
  <header>
    <h1>自己紹介ページ</h1>
  </header>

  <main>
    <!-- ▼▼▼ 旅人さんの元の自己紹介部分（そのまま） ▼▼▼ -->
    <section class="profile">
      <img src="https://via.placeholder.com/120" alt="">
      <div class="profile-text">
        <h2>ぽっし</h2>
        <p>住んでいる場所：東京都</p>
        <p>好きなこと：Web制作・ゲーム・音楽制作 など</p>
      </div>
    </section>

    <section>
      <h2>自己紹介</h2>
      <p>
        ぽっしです。<br>
      </p>
    </section>

    <section>
      <h2>趣味・興味</h2>
      <ul>
        <li>Web制作（HTML / CSS / JavaScript）</li>
        <li>PCゲーム</li>
        <li>音楽制作</li>
        <li>3D制作（Mayaなど）</li>
      </ul>
    </section>

    <section>
      <h2>今取り組んでいること</h2>
      <p>
        ・JavaScript の勉強をしながら、ちょっとしたツールやページを作っています。<br>
        ・デザインやレイアウトも、少しずつ試行錯誤中です。
      </p>
    </section>
    <!-- ▲▲▲ 元の自己紹介ここまで ▲▲▲ -->

    <!-- ▼▼▼ 競馬ミニゲーム ▼▼▼ -->
    <section class="race-track">
      <h2>自己賞</h2>

      <div class="race-ui">
        <p>勝つ馬を予想してからスタートしてください。</p>

        <select id="bet">
          <option value="1">🐴 1号（スタミナ型）</option>
          <option value="2">🐴 2号（瞬発型）</option>
          <option value="3">🐴 3号（バランス型）</option>
        </select>

        <button id="startBtn">レース開始！</button>

        <div id="result"></div>
        <div id="record"></div>
      </div>

      <div class="race-field">
        <div class="goal-line"></div>

        <div id="horse1" class="horse">🐴 1号</div>
        <div id="horse2" class="horse">🐴 2号</div>
        <div id="horse3" class="horse">🐴 3号</div>
      </div>
    </section>
    <!-- ▲▲▲ 競馬ミニゲームここまで ▲▲▲ -->

  </main>

  <footer>
    &copy; 2026 ぽっし
  </footer>

  <script>
    const horses = [
      document.getElementById("horse1"),
      document.getElementById("horse2"),
      document.getElementById("horse3")
    ];

    const startBtn = document.getElementById("startBtn");
    const result = document.getElementById("result");
    const record = document.getElementById("record");
    const bet = document.getElementById("bet");

    const goalX = 650; // ← ゴール線の位置

    let winCount = JSON.parse(localStorage.getItem("winCount")) || [0,0,0];

    function updateRecord() {
      record.textContent =
        `勝率：1号 ${winCount[0]}勝 / 2号 ${winCount[1]}勝 / 3号 ${winCount[2]}勝`;
    }
    updateRecord();

    startBtn.addEventListener("click", () => {
      result.textContent = "";
      horses.forEach(h => h.style.left = "0px");

      let finished = false;

      const sashiHorse = Math.floor(Math.random() * 3);
      const sashiBoost = 3 + Math.random() * 3;

      horses.forEach((horse, index) => {
        let pos = 0;

        const personality = [
          2.2 + Math.random() * 1.5,
          2.0 + Math.random() * 1.8,
          2.1 + Math.random() * 1.6
        ][index];

        const timer = setInterval(() => {
          pos += personality;

          if (pos > goalX - 150 && index === sashiHorse) {
            pos += sashiBoost;
          }

          horse.style.left = pos + "px";

          /* ★ 馬の先頭（pos + 60）が線に触れた瞬間ゴール ★ */
          if (pos + 60 >= goalX && !finished) {
            finished = true;
            clearInterval(timer);

            const winner = index + 1;
            result.textContent = `優勝：${winner}号！`;

            winCount[index]++;
            localStorage.setItem("winCount", JSON.stringify(winCount));
            updateRecord();

            if (Number(bet.value) === winner) {
              result.textContent += " 的中！";
            } else {
              result.textContent += " 不的中...";
            }
          }

          if (finished) clearInterval(timer);
        }, 40);
      });
    });
  </script>
</body>
</html>
