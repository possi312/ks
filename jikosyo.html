<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自己紹介 - aaaaaaaa</title>
  <style>
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #4a90e2;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 30px auto;
      background: #fff;
      padding: 20px 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
    }

    /* --- 競馬ゲーム用スタイル --- */
    .race-track {
      margin-top: 40px;
      padding: 20px;
      background: #eef6ff;
      border-radius: 10px;
    }

    .race-ui {
      margin-bottom: 20px;
    }

    .race-field {
      position: relative;
      background: #dff0ff;
      height: 360px;
      width: 800px;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 20px;
    }

    .goal-line {
      position: absolute;
      left: 700px;
      top: 0;
      width: 4px;
      height: 100%;
      background: red;
    }

    .horse {
      width: 60px;
      height: 40px;
      background: #ffcc66;
      border-radius: 8px;
      text-align: center;
      line-height: 40px;
      position: absolute;
      left: 0;
      font-weight: bold;
    }

    #horse1 { top: 40px; }
    #horse2 { top: 110px; }
    #horse3 { top: 180px; }
    #horse4 { top: 250px; }
    #horse5 { top: 320px; }

    #result {
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    #record, #odds, #asset {
      margin-top: 10px;
      font-size: 1rem;
      color: #333;
    }

    /* ★ レース開始ボタン（黄色背景＋白文字） */
    #startBtn {
      padding: 10px 20px;
      background: #ffd633;   /* 黄色 */
      color: #ffffff;        /* ← 白文字 */
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
    }
    #startBtn:hover {
      background: #ffcc00;
    }

    /* ★ 総資産リセットボタン（白黒） */
    #resetAsset {
      margin-top: 10px;
      padding: 6px 12px;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    #resetAsset:hover {
      background: #e6e6e6;
    }
  </style>
</head>
<body>
  <header>
    <h1>自己紹介ページ</h1>
  </header>

  <main>

    <!-- ▼▼▼ 競馬ミニゲーム ▼▼▼ -->
    <section class="race-track">
      <h2>🎮 ぽっし杯ミニ競馬（逆転強化・複数加速・オッズ修正・総資産リセット）</h2>

      <div class="race-ui">
        <p>勝つ馬を予想して、賭け金を入力してからスタートしてください。</p>

        <select id="bet">
          <option value="1">🐴 1号</option>
          <option value="2">🐴 2号</option>
          <option value="3">🐴 3号</option>
          <option value="4">🐴 4号</option>
          <option value="5">🐴 5号</option>
        </select>

        <input id="money" type="number" placeholder="賭け金（円）" min="1" style="margin-left:10px;">

        <button id="startBtn">レース開始！</button>

        <div id="odds"></div>
        <div id="result"></div>
        <div id="record"></div>

        <div id="asset"></div>
        <button id="resetAsset">総資産をリセット</button>
      </div>

      <div class="race-field">
        <div class="goal-line"></div>

        <div id="horse1" class="horse">🐴 1号</div>
        <div id="horse2" class="horse">🐴 2号</div>
        <div id="horse3" class="horse">🐴 3号</div>
        <div id="horse4" class="horse">🐴 4号</div>
        <div id="horse5" class="horse">🐴 5号</div>
      </div>
    </section>
    <!-- ▲▲▲ 競馬ミニゲームここまで ▲▲▲ -->

  </main>

  <footer>
    &copy; 2026 ぽっし
  </footer>

  <script>
    const horses = [
      document.getElementById("horse1"),
      document.getElementById("horse2"),
      document.getElementById("horse3"),
      document.getElementById("horse4"),
      document.getElementById("horse5")
    ];

    const startBtn = document.getElementById("startBtn");
    const result = document.getElementById("result");
    const record = document.getElementById("record");
    const oddsBox = document.getElementById("odds");
    const bet = document.getElementById("bet");
    const moneyInput = document.getElementById("money");
    const assetBox = document.getElementById("asset");
    const resetAssetBtn = document.getElementById("resetAsset");

    const goalX = 700;

    /* ★ 総資産（初期値 10000円）を保存 ★ */
    let asset = Number(localStorage.getItem("asset")) || 10000;

    function updateAsset() {
      assetBox.textContent = `総資産：${asset}円`;
    }
    updateAsset();

    /* 勝率記録（5頭） */
    let winCount = JSON.parse(localStorage.getItem("winCount5")) || [0,0,0,0,0];

    function updateRecord() {
      record.textContent =
        `勝率：1号 ${winCount[0]}勝 / 2号 ${winCount[1]}勝 / 3号 ${winCount[2]}勝 / 4号 ${winCount[3]}勝 / 5号 ${winCount[4]}勝`;
    }
    updateRecord();

    /* オッズ計算（勝率更新前の値を使う） */
    function calcOdds() {
      const totalWins = winCount.reduce((a,b)=>a+b,0) || 1;
      let odds = winCount.map(w => {
        const rate = w / totalWins;
        const o = 1 / (rate + 0.05);
        return Math.min(Math.max(o, 1.1), 10).toFixed(1);
      });

      oddsBox.textContent =
        `オッズ：1号 ${odds[0]}倍 / 2号 ${odds[1]}倍 / 3号 ${odds[2]}倍 / 4号 ${odds[3]}倍 / 5号 ${odds[4]}倍`;

      return odds;
    }
    let odds = calcOdds();

    /* 総資産リセット */
    resetAssetBtn.addEventListener("click", () => {
      asset = 10000;
      localStorage.setItem("asset", asset);
      updateAsset();
      alert("総資産をリセットしました");
    });

    /* レース開始 */
    startBtn.addEventListener("click", () => {
      const money = Number(moneyInput.value);
      if (!money || money <= 0) {
        alert("賭け金を入力してください！");
        return;
      }

      result.textContent = "";
      horses.forEach(h => h.style.left = "0px");

      let finished = false;

      /* ★ 複数頭のおいくらべ（2〜4頭） */
      const sashiCount = Math.floor(Math.random() * 3) + 2;
      const sashiHorses = [];
      while (sashiHorses.length < sashiCount) {
        const r = Math.floor(Math.random() * 5);
        if (!sashiHorses.includes(r)) sashiHorses.push(r);
      }

      /* ★ 馬ごとに加速量を変える（6〜12px） */
      const sashiBoosts = Array.from({length:5}, () => 6 + Math.random() * 6);

      /* ★ personality を少し弱めて逃げ馬を抑える */
      const personalities = [
        1.8 + Math.random() * 1.2,
        1.7 + Math.random() * 1.4,
        1.9 + Math.random() * 1.3,
        1.6 + Math.random() * 1.5,
        1.7 + Math.random() * 1.4
      ];

      horses.forEach((horse, index) => {
        let pos = 0;

        const timer = setInterval(() => {
          pos += personalities[index];

          /* ★ 終盤加速の発動位置を早める（ゴール前250px） */
          if (pos > goalX - 250 && sashiHorses.includes(index)) {
            pos += sashiBoosts[index];
          }

          horse.style.left = pos + "px";

          /* ★ 馬の先頭（pos + 60）が線に触れた瞬間ゴール ★ */
          if (pos + 60 >= goalX && !finished) {
            finished = true;
            clearInterval(timer);

            const winner = index + 1;
            result.textContent = `優勝：${winner}号！`;

            /* ★ 勝率更新（オッズ計算はこの後） */
            winCount[index]++;
            localStorage.setItem("winCount5", JSON.stringify(winCount));
            updateRecord();

            /* ★ 資産計算（勝率更新前のオッズを使う） */
            const betHorse = Number(bet.value);
            if (betHorse === winner) {
              const payout = Math.floor(money * odds[index]);
              asset += payout;
              result.textContent += `的中！ 配当：${payout}円`;
            } else {
              asset -= money;
              result.textContent += "不的中...";
            }

            localStorage.setItem("asset", asset);
            updateAsset();

            /* ★ 勝率更新後にオッズ再計算（次回用） */
            odds = calcOdds();
          }

          if (finished) clearInterval(timer);
        }, 40);
      });
    });
  </script>
</body>
</html>
